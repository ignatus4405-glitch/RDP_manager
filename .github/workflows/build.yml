name: Build

# Автосборка установщиков ПОСЛЕ КАЖДОГО изменения:
#  - любой push (ветки и теги) → сборка + артефакты
#  - PR в main                → сборка + артефакты (проверка перед мержем)
#  - тег v*                   → + публикация установщиков и latest*.yml в GitHub Release
#  - вручную                  → workflow_dispatch
on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # публикация релиза на тегах

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows (NSIS)
          - os: ubuntu-latest
            label: Linux (AppImage)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Установка зависимостей
        shell: bash
        run: npm ci

      - name: Синтаксическая проверка
        shell: bash
        run: npm run check

      - name: Смоук-тесты сервера
        shell: bash
        run: npm test

      - name: Сборка установщика (electron-builder, без публикации)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm run dist --workspace client > /tmp/dist.log 2>&1 || {
            echo "----- последние строки вывода electron-builder -----"
            tail -n 40 /tmp/dist.log
            echo "----- аннотации для диагностики -----"
            tail -n 8 /tmp/dist.log | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g' | sed 's/^/::error::/'
            exit 1
          }

      - name: Проверка app-update.yml (конфиг автообновления внутри сборки)
        shell: bash
        run: |
          YML=$(find client/dist -name app-update.yml -path '*resources*' | head -n 1)
          if [ -z "$YML" ]; then
            echo "::error::app-update.yml не встроен в сборку — автообновление у клиентов работать не будет"
            find client/dist -maxdepth 3 | head -30
            exit 1
          fi
          echo "Встроенный конфиг автообновления:"
          cat "$YML"

      - name: Генерация latest.yml для автообновления
        shell: bash
        run: node client/scripts/make-latest-yml.js

      - name: Содержимое client/dist (для диагностики)
        shell: bash
        run: ls -la client/dist

      - name: Артефакты сборки
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            client/dist/*.exe
            client/dist/*.exe.blockmap
            client/dist/*.AppImage
            client/dist/*.AppImage.blockmap
            client/dist/latest*.yml
          retention-days: 14
          if-no-files-found: warn

      - name: Публикация в GitHub Release (только на тегах v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: RDP Manager ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            client/dist/*.exe
            client/dist/*.exe.blockmap
            client/dist/*.AppImage
            client/dist/*.AppImage.blockmap
            client/dist/latest*.yml
