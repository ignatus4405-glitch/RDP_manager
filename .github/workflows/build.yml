name: Build

# Автосборка установщиков ПОСЛЕ КАЖДОГО изменения:
#  - любой push (ветки и теги) → сборка + артефакты
#  - PR в main                → сборка + артефакты (проверка перед мержем)
#  - тег v*                   → + публикация установщиков и latest*.yml в GitHub Release
#  - вручную                  → workflow_dispatch
on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # публикация релиза на тегах

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows (NSIS)
          - os: ubuntu-latest
            label: Linux (AppImage)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Установка зависимостей
        shell: bash
        run: npm ci

      - name: Синтаксическая проверка
        shell: bash
        run: npm run check

      - name: Смоук-тесты сервера
        shell: bash
        run: npm test

      - name: Сборка установщика (electron-builder, без публикации)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm run dist --workspace client > /tmp/dist.log 2>&1 || {
            echo "----- последние строки вывода electron-builder -----"
            tail -n 40 /tmp/dist.log
            echo "----- аннотации для диагностики -----"
            tail -n 8 /tmp/dist.log | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g' | sed 's/^/::error::/'
            exit 1
          }

      - name: Проверка app-update.yml (конфиг автообновления внутри сборки)
        shell: bash
        run: |
          YML=$(find client/dist -name app-update.yml -path '*resources*' | head -n 1)
          if [ -z "$YML" ]; then
            echo "::error::app-update.yml не встроен в сборку — автообновление у клиентов работать не будет"
            find client/dist -maxdepth 3 | head -30
            exit 1
          fi
          echo "Встроенный конфиг автообновления:"
          cat "$YML"

      - name: Генерация latest.yml для автообновления
        shell: bash
        run: node client/scripts/make-latest-yml.js

      - name: Содержимое client/dist (для диагностики)
        shell: bash
        run: ls -la client/dist

      - name: Артефакты сборки
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            client/dist/*.exe
            client/dist/*.exe.blockmap
            client/dist/*.AppImage
            client/dist/*.AppImage.blockmap
            client/dist/latest*.yml
          retention-days: 14
          if-no-files-found: warn

      - name: Публикация в GitHub Release (только на тегах v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: RDP Manager ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            client/dist/*.exe
            client/dist/*.exe.blockmap
            client/dist/*.AppImage
            client/dist/*.AppImage.blockmap
            client/dist/latest*.yml

  # =========================================================
  #  Серверный установщик (SEA single-binary):
  #   Windows → NSIS .exe (задача Планировщика от SYSTEM, правило брандмауэра, ярлыки)
  #   Linux   → tar.gz + systemd-юнит
  # =========================================================
  build-server:
    name: Server · ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows (NSIS)
          - os: ubuntu-latest
            label: Linux (tar.gz + systemd)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Установка зависимостей (без бинарника Electron — серверу не нужен)
        shell: bash
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
        run: npm ci

      - name: Сборка однофайлового сервера (esbuild → SEA)
        shell: bash
        run: npm run build:sea --workspace server

      - name: Смоук-тест SEA-бинарника (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p /tmp/sea-test
          cp server/dist/rdp-manager-server /tmp/sea-test/
          cp -r server/web /tmp/sea-test/
          chmod +x /tmp/sea-test/rdp-manager-server
          (cd /tmp/sea-test && RDP_MANAGER_PORT=8799 ./rdp-manager-server > /tmp/sea-test.log 2>&1 & echo $! > /tmp/sea-test.pid)
          for i in $(seq 1 40); do curl -sf http://127.0.0.1:8799/api/health && break || sleep 0.5; done
          echo
          curl -sf -X POST http://127.0.0.1:8799/api/login -H 'Content-Type: application/json' -d '{"username":"admin","password":"admin123"}' | grep -q token
          curl -sf -o /dev/null -w 'web panel → HTTP %{http_code}\n' http://127.0.0.1:8799/
          kill "$(cat /tmp/sea-test.pid)"

      - name: Упаковка Windows-установщика (NSIS)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          try {
            choco install nsis -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw "choco install nsis вернул код $LASTEXITCODE" }

            $candidates = @(
              "${env:ProgramFilesX86}\NSIS\makensis.exe",
              "${env:ProgramFiles}\NSIS\makensis.exe",
              "${env:ChocolateyInstall}\lib\nsis\tools\makensis.exe"
            ) | Where-Object { Test-Path $_ }
            $cmd = Get-Command makensis -ErrorAction SilentlyContinue
            if ($cmd) { $candidates += $cmd.Source }
            if (-not $candidates) { throw 'makensis не найден ни в одном ожидаемом месте после choco install nsis' }
            $maker = $candidates[0]
            Write-Host "makensis: $maker"

            $VER = node -p "require('./package.json').version"
            $STAGE = "server/dist/stage"
            New-Item -ItemType Directory -Force $STAGE | Out-Null
            Copy-Item "server/dist/rdp-manager-server.exe" $STAGE
            Copy-Item -Recurse "server/web" "$STAGE/web"
            Copy-Item "server/installer/windows/installer.nsi" $STAGE

            Push-Location $STAGE
            & $maker "/DVERSION=$VER" "installer.nsi" *> "makensis.log"
            $code = $LASTEXITCODE
            Pop-Location
            Get-Content "$STAGE/makensis.log" | Select-Object -Last 15
            if ($code -ne 0) {
              Get-Content "$STAGE/makensis.log" | Select-Object -Last 8 | ForEach-Object { Write-Host "::error::$_" }
              exit $code
            }
            Move-Item "$STAGE/RDPManager-Server-Setup-$VER.exe" "server/dist/"
            Get-ChildItem "server/dist"
          } catch {
            Write-Host "::error::NSIS packaging failed: $($_.Exception.Message)"
            exit 1
          }

      - name: Упаковка Linux-установщика (tar.gz)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          VER=$(node -p "require('./package.json').version")
          PKG=server/dist/pkg/rdp-manager-server
          mkdir -p "$PKG"
          cp server/dist/rdp-manager-server "$PKG/"
          cp -r server/web "$PKG/web"
          cp server/installer/linux/install.sh server/installer/linux/uninstall.sh server/installer/linux/rdp-manager-server.service "$PKG/"
          chmod 755 "$PKG/rdp-manager-server" "$PKG/install.sh" "$PKG/uninstall.sh"
          tar -C server/dist/pkg -czf "server/dist/RDPManager-Server-${VER}-linux-x64.tar.gz" rdp-manager-server
          ls -la server/dist/

      - name: Артефакты серверного установщика
        uses: actions/upload-artifact@v4
        with:
          name: server-installers-${{ matrix.os }}
          path: |
            server/dist/*.exe
            server/dist/*.tar.gz
          retention-days: 14
          if-no-files-found: warn

      - name: Публикация в GitHub Release (только на тегах v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: RDP Manager ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            server/dist/*.exe
            server/dist/*.tar.gz
