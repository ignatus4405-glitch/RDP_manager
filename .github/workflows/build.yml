name: Build

# Автосборка установщиков ПОСЛЕ КАЖДОГО изменения:
#  - любой push (ветки и теги) → сборка + артефакты
#  - PR в main                → сборка + артефакты (проверка перед мержем)
#  - тег v*                   → публикация единого Windows-установщика, AppImage, Linux-сервера и latest*.yml
#  - вручную                  → workflow_dispatch
on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # публикация релиза на тегах

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows (NSIS)
          - os: ubuntu-latest
            label: Linux (AppImage)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Установка зависимостей
        shell: bash
        run: npm ci

      - name: Синтаксическая проверка
        shell: bash
        run: npm run check

      - name: Смоук-тесты сервера
        shell: bash
        run: npm test

      - name: Проверка нативного OLE-компонента
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'Visual C++ build tools not found' }
          $envscript = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          $output = cmd /c "`"$envscript`" && cl /nologo /EHsc /std:c++17 /DUNICODE /D_UNICODE client\windows\virtual-clipboard.cpp client\windows\virtual-clipboard-test.cpp /Fe:virtual-clipboard-test.exe /link ole32.lib shell32.lib user32.lib uuid.lib && virtual-clipboard-test.exe && cl /nologo /EHsc /std:c++17 /DUNICODE /D_UNICODE client\windows\virtual-clipboard.cpp client\windows\virtual-clipboard-host.cpp /Fe:client\build\rdp-virtual-clipboard.exe /link ole32.lib shell32.lib user32.lib uuid.lib crypt32.lib && node client\windows\virtual-clipboard-host-test.js" 2>&1
          $code = $LASTEXITCODE
          $output | ForEach-Object { Write-Host $_ }
          if ($code -ne 0) {
            $output | Select-Object -Last 15 | ForEach-Object { Write-Host "::error::$($_.ToString().Replace('%', '%25').Replace(':', '%3A'))" }
            exit $code
          }

      - name: Подготовка Windows-службы и объединённого установщика
        if: runner.os == 'Windows'
        shell: bash
        run: |
          npm run build:sea --workspace server
          npm run stage:windows-server --workspace client

      - name: Сборка установщика (electron-builder, без публикации)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm run dist --workspace client > dist.log 2>&1 || {
            echo "----- сообщения об ошибках electron-builder -----"
            grep -i -B 12 -A 3 -E 'warning treated as error|NSIS Error|ERR!|⨯|fatal|not found|cannot|exception' dist.log | tail -n 8 | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g' | sed 's/^/::error::/' || true
            echo "----- конец полного вывода electron-builder -----"
            tail -n 60 dist.log
            exit 1
          }

      - name: Журнал неудачной сборки Windows/Linux
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: electron-builder-log-${{ matrix.os }}
          path: dist.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Проверка app-update.yml (конфиг автообновления внутри сборки)
        shell: bash
        run: |
          YML=$(find client/dist -name app-update.yml -path '*resources*' | head -n 1)
          if [ -z "$YML" ]; then
            echo "::error::app-update.yml не встроен в сборку — автообновление у клиентов работать не будет"
            find client/dist -maxdepth 3 | head -30
            exit 1
          fi
          echo "Встроенный конфиг автообновления:"
          cat "$YML"

      - name: Генерация latest.yml для автообновления
        shell: bash
        run: node client/scripts/make-latest-yml.js

      - name: Содержимое client/dist (для диагностики)
        shell: bash
        run: ls -la client/dist

      - name: Артефакты сборки
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            client/dist/*.exe
            client/dist/*.exe.blockmap
            client/dist/*.AppImage
            client/dist/*.AppImage.blockmap
            client/dist/latest*.yml
          retention-days: 14
          if-no-files-found: warn

      - name: Публикация в GitHub Release (только на тегах v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: RDP Manager ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            client/dist/*.exe
            client/dist/*.exe.blockmap
            client/dist/*.AppImage
            client/dist/*.AppImage.blockmap
            client/dist/latest*.yml

  # =========================================================
  #  Linux-серверный архив (Windows-сервис включён в единый клиентский NSIS-установщик выше).
  #  Linux → tar.gz + systemd-юнит
  # =========================================================
  build-server:
    name: Server · Linux (tar.gz + systemd)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Установка зависимостей (без бинарника Electron — серверу не нужен)
        shell: bash
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
        run: npm ci

      - name: Сборка однофайлового сервера (esbuild → SEA)
        shell: bash
        run: npm run build:sea --workspace server

      - name: Смоук-тест SEA-бинарника (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p /tmp/sea-test
          cp server/dist/rdp-manager-server /tmp/sea-test/
          cp -r server/web /tmp/sea-test/
          chmod +x /tmp/sea-test/rdp-manager-server
          (cd /tmp/sea-test && RDP_MANAGER_PORT=8799 ./rdp-manager-server > /tmp/sea-test.log 2>&1 & echo $! > /tmp/sea-test.pid)
          for i in $(seq 1 40); do curl -sf http://127.0.0.1:8799/api/health && break || sleep 0.5; done
          echo
          curl -sf -X POST http://127.0.0.1:8799/api/login -H 'Content-Type: application/json' -d '{"username":"admin","password":"admin123"}' | grep -q token
          curl -sf -o /dev/null -w 'web panel → HTTP %{http_code}\n' http://127.0.0.1:8799/
          kill "$(cat /tmp/sea-test.pid)"

      - name: Упаковка Linux-установщика (tar.gz)
        shell: bash
        run: |
          VER=$(node -p "require('./package.json').version")
          PKG=server/dist/pkg/rdp-manager-server
          mkdir -p "$PKG"
          cp server/dist/rdp-manager-server "$PKG/"
          cp -r server/web "$PKG/web"
          cp server/installer/linux/install.sh server/installer/linux/uninstall.sh server/installer/linux/rdp-manager-server.service "$PKG/"
          chmod 755 "$PKG/rdp-manager-server" "$PKG/install.sh" "$PKG/uninstall.sh"
          tar -C server/dist/pkg -czf "server/dist/RDPManager-Server-${VER}-linux-x64.tar.gz" rdp-manager-server
          rm -f server/dist/rdp-manager-server
          ls -la server/dist/

      - name: Артефакты серверного установщика
        uses: actions/upload-artifact@v4
        with:
          name: server-installers-linux
          path: |
            server/dist/RDPManager-Server-*-linux-x64.tar.gz
          retention-days: 14
          if-no-files-found: warn

      - name: Публикация в GitHub Release (только на тегах v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: RDP Manager ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            server/dist/RDPManager-Server-*-linux-x64.tar.gz
