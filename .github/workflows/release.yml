name: Release Please

# Workflow Release Please оставлен как конфигурация, но в этом репозитории GITHUB_TOKEN
# не имеет права создавать PR. Подготовку release PR, bump версий и CHANGELOG выполняют
# вручную; после мержа тег vX.Y.Z отправляется вручную и запускает Build.
on:
  push:
    branches: [main]

permissions:
  contents: write        # создание тега и релиза
  pull-requests: write   # создание/обновление Release PR

jobs:
  release-please:
    name: Release PR / tag
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
